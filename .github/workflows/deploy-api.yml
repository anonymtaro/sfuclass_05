# =============================================================================
# Deploy API · migrations first, then a rolling replacement
# =============================================================================
# Order matters and is not negotiable:
#
#   1. verify the image signature                 nothing unsigned reaches a cluster
#   2. run migrations as a one-off ECS task       advisory-locked, exits non-zero on failure
#   3. update api, realtime and worker services   rolling, circuit breaker armed
#   4. wait for services-stable                   readiness, not "task started"
#   5. smoke test                                 login · room · chat · upload
#   6. roll back automatically if 3–5 fail
#
# Migrations are additive only (expand-then-contract, see the architecture
# document, section 9.1). That is what makes step 6 safe: the previous image
# always meets a schema it can still read.
#
# Environment variables required per GitHub Environment:
#   AWS_ACCOUNT_ID · AWS_DEPLOY_ROLE · ECS_CLUSTER · API_URL
# =============================================================================

name: deploy-api

on:
  workflow_call:
    inputs:
      environment:
        description: staging | production
        type: string
        required: true
      release_sha:
        description: Commit SHA whose images are deployed
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      release_sha:
        description: Commit SHA to deploy (must already exist in ECR)
        type: string
        required: true

# One deployment per environment at a time. Queued, never cancelled — a
# half-applied migration is worse than a slow pipeline.
concurrency:
  group: deploy-api-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    # Production carries a required reviewer on the GitHub Environment; that is
    # the manual approval gate, not a step in this file.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.API_URL }}
    timeout-minutes: 45

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER: ${{ vars.ECS_CLUSTER }}
      ENV: ${{ inputs.environment }}
      SHA: ${{ inputs.release_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-api-${{ inputs.environment }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------------
      - name: Resolve image digests
        id: images
        run: |
          set -euo pipefail
          for repo in classroom-api classroom-worker; do
            digest=$(aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids imageTag="${SHA}" \
              --query 'imageDetails[0].imageDigest' --output text)
            if [ "$digest" = "None" ]; then
              echo "::error::no image for ${repo}:${SHA} — run build-images first"
              exit 1
            fi
            key=$(echo "$repo" | tr '-' '_')
            echo "${key}=${{ steps.ecr.outputs.registry }}/${repo}@${digest}" >> "$GITHUB_OUTPUT"
          done

      - uses: sigstore/cosign-installer@v3

      - name: Verify signatures
        run: |
          set -euo pipefail
          for image in "${{ steps.images.outputs.classroom_api }}" \
                       "${{ steps.images.outputs.classroom_worker }}"; do
            cosign verify "$image" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > /dev/null
            echo "signature ok: $image"
          done

      # -----------------------------------------------------------------------
      # Record what is running now. This is the rollback target, captured before
      # anything changes rather than reconstructed afterwards.
      # -----------------------------------------------------------------------
      - name: Capture current task definitions
        id: previous
        run: |
          set -euo pipefail
          for svc in api realtime worker; do
            arn=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "classroom-${ENV}-${svc}" \
              --query 'services[0].taskDefinition' --output text)
            echo "${svc}=${arn}" >> "$GITHUB_OUTPUT"
            echo "previous ${svc}: ${arn}"
          done

      # -----------------------------------------------------------------------
      # Migrations. A Postgres advisory lock inside migrate.js makes a
      # concurrent run a no-op, so a retried workflow cannot corrupt anything.
      # -----------------------------------------------------------------------
      - name: Run database migrations
        run: |
          set -euo pipefail
          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "classroom-${ENV}-migrate" \
            --launch-type FARGATE \
            --network-configuration "$(cat ops/migrations/network-config.${ENV}.json)" \
            --overrides "$(jq -nc --arg img '${{ steps.images.outputs.classroom_api }}' '
              {containerOverrides:[{name:"migrate",image:$img,
                command:["node","server/src/db/migrate.js","up"]}]}')" \
            --started-by "gha-${SHA::7}" \
            --query 'tasks[0].taskArn' --output text)

          echo "migration task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"

          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          reason=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].stoppedReason' --output text)

          if [ "$exit_code" != "0" ]; then
            echo "::error::migration failed (exit ${exit_code}): ${reason}"
            echo "::notice::no service was updated — the previous release is still serving"
            exit 1
          fi
          echo "migrations applied"

      # -----------------------------------------------------------------------
      # New task definition revisions. The running definition is read, the image
      # swapped and re-registered, so infrastructure changes made by Terraform
      # are never overwritten by a deploy.
      # -----------------------------------------------------------------------
      - name: Register task definitions
        id: taskdefs
        run: |
          set -euo pipefail
          register() {
            local family="$1" image="$2"
            aws ecs describe-task-definition --task-definition "$family" \
              --query 'taskDefinition' --output json \
            | jq --arg img "$image" --arg sha "$SHA" '
                .containerDefinitions |= map(
                  .image = $img
                  | .environment = ((.environment // [])
                      | map(select(.name != "RELEASE_SHA"))
                      + [{name:"RELEASE_SHA", value:$sha}])
                )
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                      .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
              ' > "taskdef-${family}.json"
            aws ecs register-task-definition --cli-input-json "file://taskdef-${family}.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text
          }

          echo "api=$(register "classroom-${ENV}-api" '${{ steps.images.outputs.classroom_api }}')" >> "$GITHUB_OUTPUT"
          echo "realtime=$(register "classroom-${ENV}-realtime" '${{ steps.images.outputs.classroom_api }}')" >> "$GITHUB_OUTPUT"
          echo "worker=$(register "classroom-${ENV}-worker" '${{ steps.images.outputs.classroom_worker }}')" >> "$GITHUB_OUTPUT"

      - name: Update services
        run: |
          set -euo pipefail
          update() {
            aws ecs update-service --cluster "$CLUSTER" \
              --service "classroom-${ENV}-$1" --task-definition "$2" \
              --health-check-grace-period-seconds 60 \
              --no-cli-pager --query 'service.serviceName' --output text
          }
          update api      "${{ steps.taskdefs.outputs.api }}"
          update realtime "${{ steps.taskdefs.outputs.realtime }}"
          update worker   "${{ steps.taskdefs.outputs.worker }}"

      # The deployment circuit breaker configured in ecs-api.tf rolls back on
      # failing health checks by itself; this wait is what surfaces that to CI.
      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "classroom-${ENV}-api" "classroom-${ENV}-realtime" "classroom-${ENV}-worker"

      - name: Verify the running release
        run: |
          set -euo pipefail
          running=$(curl -fsS --retry 5 --retry-delay 5 "${{ vars.API_URL }}/healthz" | jq -r '.release')
          if [ "$running" != "$SHA" ]; then
            echo "::error::expected ${SHA}, /healthz reports ${running}"
            exit 1
          fi

      # -----------------------------------------------------------------------
      - name: Roll back
        if: failure() && steps.taskdefs.outcome == 'success'
        run: |
          set -euo pipefail
          echo "::warning::deployment failed — reverting to the previous task definitions"
          for svc in api realtime worker; do
            case "$svc" in
              api)      prev="${{ steps.previous.outputs.api }}" ;;
              realtime) prev="${{ steps.previous.outputs.realtime }}" ;;
              worker)   prev="${{ steps.previous.outputs.worker }}" ;;
            esac
            aws ecs update-service --cluster "$CLUSTER" \
              --service "classroom-${ENV}-${svc}" --task-definition "$prev" --no-cli-pager > /dev/null
          done
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "classroom-${ENV}-api" "classroom-${ENV}-realtime" "classroom-${ENV}-worker"
          echo "rollback complete — the database schema is one release ahead, which is expected"

      - name: Summary
        if: always()
        run: |
          {
            echo "### API deploy · ${ENV}"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Release | \`${SHA}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  smoke:
    name: smoke
    needs: deploy
    uses: ./.github/workflows/e2e-smoke.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit