# =============================================================================
# Build images · one build per release, promoted by digest
# =============================================================================
# Three images come out of this repository, all built from the repository root
# so they can see packages/*:
#
#   classroom-api      server/Dockerfile.api      api + realtime + migrations
#   classroom-sfu      server/Dockerfile.sfu      mediasoup
#   classroom-worker   server/Dockerfile.worker   BullMQ + ffmpeg
#
# The image is built once, here. Staging and production deploy the same digest;
# nothing is ever rebuilt for a promotion, because a rebuild is a different
# artifact no matter how identical the source was.
#
# Required repository variables:  AWS_REGION, BUILD_AWS_ACCOUNT_ID, BUILD_AWS_ROLE
# =============================================================================

name: build-images

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'infra/**'
      - 'apps/mobile/**'
  workflow_dispatch:
  # Called by the deploy workflows when an image for a SHA does not exist yet.
  workflow_call:
    outputs:
      release_sha:
        description: Commit SHA the images are tagged with
        value: ${{ jobs.build.outputs.release_sha }}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC to ECR
  packages: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release_sha: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: classroom-api
            dockerfile: server/Dockerfile.api
          - image: classroom-sfu
            dockerfile: server/Dockerfile.sfu
          - image: classroom-worker
            dockerfile: server/Dockerfile.worker

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.BUILD_AWS_ACCOUNT_ID }}:role/${{ vars.BUILD_AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ matrix.image }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: production
          push: true
          # Two tags: the SHA is what deploys, `main` is only for humans reading
          # the console. Nothing is ever deployed by the moving tag.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:main
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          # Layer cache lives in the registry, so a cold runner still starts warm.
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:buildcache,mode=max
          provenance: mode=max
          sbom: true
          platforms: linux/amd64

      # Vulnerabilities are judged on the image that will actually run, not on
      # the lockfile. Fails the build on a fixable critical or high finding.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif
          retention-days: 30
          if-no-files-found: ignore

      # Keyless signing. The deploy workflows verify the signature before they
      # register a task definition, so an image pushed by anything other than
      # this workflow cannot reach a cluster.
      - uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ steps.ecr.outputs.registry }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}"

      - name: Export digest
        run: |
          echo "${{ matrix.image }} → ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # A green build goes to staging on its own. Production is a separate,
  # approval-gated run of the same deploy workflows.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: deploy staging
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy-api.yml
    with:
      environment: staging
      release_sha: ${{ github.sha }}
    secrets: inherit