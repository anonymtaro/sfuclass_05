# =============================================================================
# Terraform · plan on a pull request, apply on main
# =============================================================================
# Two roles, deliberately different:
#
#   TF_PLAN_ROLE    read-only, assumed on pull requests. A fork or an unreviewed
#                   branch can therefore produce a plan but can never change
#                   anything.
#   TF_APPLY_ROLE   write, assumed only on main and only inside a GitHub
#                   Environment. Production carries a required reviewer.
#
# State lives in S3 with DynamoDB locking, one backend per environment:
#   infra/envs/{dev,staging,prod}/backend.hcl
#   infra/envs/{dev,staging,prod}/terraform.tfvars
#
# Staging applies automatically after a merge. Production is a separate,
# approved run, so the same plan is reviewed by a human before it lands.
# =============================================================================

name: terraform

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        required: true
      action:
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  group: terraform-${{ inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write # to post the plan as a comment

env:
  TF_VERSION: 1.12.1
  TF_IN_AUTOMATION: 'true'
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ---------------------------------------------------------------------------
  validate:
    name: fmt · validate · security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive -diff

      # No backend, so validation needs no credentials and runs on any branch.
      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - uses: terraform-linters/setup-tflint@v4
      - name: Lint
        run: |
          tflint --chdir=infra --init
          tflint --chdir=infra --recursive

      # Same scanner as the image pipeline, different target: misconfiguration
      # rather than vulnerable packages.
      - name: Scan configuration
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  # ---------------------------------------------------------------------------
  plan:
    name: plan · ${{ matrix.env }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A pull request is planned against every environment it could reach, so
        # a change that only breaks production is caught before the merge.
        env: ${{ fromJSON(github.event_name == 'pull_request' && '["staging","prod"]' || '["staging"]') }}
    environment:
      name: ${{ matrix.env }}-plan

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.TF_PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-plan-${{ matrix.env }}

      - name: Init
        run: terraform -chdir=infra init -backend-config="envs/${{ matrix.env }}/backend.hcl"

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          terraform -chdir=infra plan \
            -var-file="envs/${{ matrix.env }}/terraform.tfvars" \
            -lock-timeout=5m \
            -out="tfplan-${{ matrix.env }}" \
            -detailed-exitcode || exit_code=$?
          echo "exit_code=${exit_code:-0}" >> "$GITHUB_OUTPUT"
          terraform -chdir=infra show -no-color "tfplan-${{ matrix.env }}" > "plan-${{ matrix.env }}.txt"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: |
            infra/tfplan-${{ matrix.env }}
            infra/plan-${{ matrix.env }}.txt
          retention-days: 14

      - name: Comment the plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('infra/plan-${{ matrix.env }}.txt', 'utf8');
            const body = raw.length > 60000
              ? raw.slice(0, 60000) + '\n\n… truncated, see the workflow artifact'
              : raw;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform plan · \`${{ matrix.env }}\`\n\n<details><summary>show</summary>\n\n\`\`\`hcl\n${body}\n\`\`\`\n\n</details>`,
            });

      # A plan that would destroy something is allowed, but never silently.
      - name: Flag destructive changes
        run: |
          set -euo pipefail
          if grep -qE '^\s*# .* will be destroyed' "infra/plan-${{ matrix.env }}.txt"; then
            echo "::warning::this plan destroys resources — read it before approving"
            grep -E '^\s*# .* will be destroyed' "infra/plan-${{ matrix.env }}.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  apply:
    name: apply · ${{ inputs.environment || 'staging' }}
    needs: plan
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (write)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.TF_APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-apply-${{ inputs.environment || 'staging' }}

      - name: Init
        run: |
          terraform -chdir=infra init \
            -backend-config="envs/${{ inputs.environment || 'staging' }}/backend.hcl"

      # The saved plan is applied, not a fresh one. What was reviewed is what
      # runs, even if main moved in the meantime.
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment || 'staging' }}
          path: infra

      - name: Apply
        run: |
          terraform -chdir=infra apply -lock-timeout=10m -auto-approve \
            "tfplan-${{ inputs.environment || 'staging' }}"

      - name: Publish outputs
        run: |
          {
            echo "### Terraform apply · ${{ inputs.environment || 'staging' }}"
            echo ""
            echo '```'
            terraform -chdir=infra output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"