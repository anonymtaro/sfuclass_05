# =============================================================================
# Deploy mobile · EAS build and store submission
# =============================================================================
# The mobile app is on a different clock from the server: a store review takes
# days, and an old build stays on devices for months. Two consequences shape
# this workflow:
#
#   1. contract tests are a hard gate — a build that ships against a contract
#      the API is about to drop becomes a broken app nobody can hot-fix
#   2. the API keeps the previous contract version alive for one release cycle
#      after a mobile release, which is what makes a slow rollout survivable
#
# Triggers
#   tag mobile-v*     build and submit to both stores
#   workflow_dispatch pick platform and profile (preview builds for testers)
#
# Secrets:  EXPO_TOKEN  ·  store credentials live in EAS, not here
# =============================================================================

name: deploy-mobile

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: Submit to the stores after the build
        type: boolean
        default: false

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: 0
  # A tag build is always a production build; a dispatch uses what was chosen.
  EAS_PROFILE: ${{ inputs.profile || 'production' }}
  EAS_PLATFORM: ${{ inputs.platform || 'all' }}

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Cheap, and it prevents the one failure mode that cannot be rolled back.
  # ---------------------------------------------------------------------------
  verify:
    name: contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:contract
      - name: Lint the mobile app
        run: npm run lint --workspace @classroom/mobile

  # ---------------------------------------------------------------------------
  build:
    name: EAS build · ${{ inputs.profile || 'production' }}
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: ${{ (inputs.profile == 'preview' && 'staging') || 'production' }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # app.config.ts reads these; the same names the web build uses, so one
      # environment feeds both clients.
      - name: Build
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          EXPO_PUBLIC_WS_URL: ${{ vars.PUBLIC_WS_URL }}
          EXPO_PUBLIC_CDN_DOMAIN: ${{ vars.CDN_DOMAIN }}
          EXPO_PUBLIC_ENVIRONMENT: ${{ inputs.profile || 'production' }}
          EXPO_PUBLIC_RELEASE_SHA: ${{ github.sha }}
        run: |
          eas build \
            --platform "${EAS_PLATFORM}" \
            --profile "${EAS_PROFILE}" \
            --non-interactive \
            --no-wait=false \
            --json > build-result.json
          cat build-result.json

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-${{ github.run_id }}
          path: apps/mobile/build-result.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Submission is separate so a build can be produced, tested by humans, and
  # only then pushed to review.
  # ---------------------------------------------------------------------------
  submit:
    name: store submission
    needs: build
    if: startsWith(github.ref, 'refs/tags/mobile-v') || inputs.submit
    runs-on: ubuntu-24.04
    environment:
      name: production # required reviewer on the environment gates this
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: Submit the latest build
        working-directory: apps/mobile
        run: |
          eas submit --platform "${EAS_PLATFORM}" --latest --non-interactive

      - name: Summary
        if: always()
        run: |
          {
            echo "### Mobile release"
            echo ""
            echo "- Tag: \`${{ github.ref_name }}\`"
            echo "- Profile: \`${EAS_PROFILE}\` · Platform: \`${EAS_PLATFORM}\`"
            echo "- Result: ${{ job.status }}"
            echo ""
            echo "Keep the previous API contract version alive until store"
            echo "adoption of this build is past the agreed threshold."
          } >> "$GITHUB_STEP_SUMMARY"